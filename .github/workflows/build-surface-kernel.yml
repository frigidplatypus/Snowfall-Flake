name: Build Surface Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - systems/x86_64-linux/surface/**
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-surface-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-surface-kernel:
    runs-on: ubuntu-latest
    env:
      NIX_OVERRIDE_INPUTS: >-
        --override-input hermes path:./.github/ci-stubs/hermes
        --override-input email-to-miniflux path:./.github/ci-stubs/email-to-miniflux
        --override-input silverbullet-mcp path:./.github/ci-stubs/silverbullet-mcp
        --override-input nr path:./.github/ci-stubs/nr
        --override-input silverbullet-api-gateway path:./.github/ci-stubs/silverbullet-api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: frgd-surface-kernel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Authenticate Cachix CLI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          cachix authtoken "$CACHIX_AUTH_TOKEN"

      - name: Update surface kernel inputs
        if: github.event_name != 'push'
        run: nix flake update nixpkgs nixos-hardware

      - name: Show kernel version
        run: nix eval $NIX_OVERRIDE_INPUTS --raw .#nixosConfigurations.surface.config.boot.kernelPackages.kernel.version

      - name: Build surface kernel
        run: nix build $NIX_OVERRIDE_INPUTS --out-link result-kernel .#nixosConfigurations.surface.config.system.build.kernel

      - name: Build surface initial ramdisk
        run: nix build $NIX_OVERRIDE_INPUTS --out-link result-initrd .#nixosConfigurations.surface.config.system.build.initialRamdisk

      - name: Push kernel artifacts to Cachix
        run: cachix push frgd-surface-kernel result-kernel result-initrd

      - name: Open flake update PR
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: automation/update-surface-kernel
          title: Update Surface kernel inputs
          commit-message: Update Surface kernel inputs
          body: |
            Updates `nixpkgs` and `nixos-hardware` for the Surface kernel.

            The workflow built the Surface kernel and initrd and pushed them to Cachix before opening this PR.
          add-paths: flake.lock
